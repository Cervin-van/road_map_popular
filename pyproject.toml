[tool.pytest.ini_options]
# --ds beats a DJANGO_SETTINGS_MODULE env var, which would otherwise win over this file
addopts = "-ra --strict-markers --ds=config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]
